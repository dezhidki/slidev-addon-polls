<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Live Vote — Slidev Polls</title>
  <style>
    :root {
      --navy: #002957;
      --gold: #C29A5B;
      --sand: #EDE1CE;
      --light: #EFF0F0;
      --steel: #6B7F97;
      --white: #FFFFFF;
      --bg: #0f1923;
      --card: #0a121c;
      --border: rgba(194, 154, 91, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Lato', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--light);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 1.5rem 1rem;
    }
    .header { text-align: center; margin-bottom: 1.2rem; width: 100%; max-width: 600px; }
    .header h1 { font-family: 'Aleo', serif; font-size: 1.4rem; font-weight: 700; color: var(--gold); margin-bottom: 0.3rem; }
    .status-pill { font-size: 0.78rem; padding: 0.2rem 0.6rem; border-radius: 20px; display: inline-block; }
    .status-connected { background: #166534; color: #86efac; }
    .status-connecting { background: #854d0e; color: #fde047; }
    .status-disconnected { background: #991b1b; color: #fca5a5; }

    /* Tab bar for multi-poll slides */
    .poll-tabs { display: flex; gap: 0.4rem; overflow-x: auto; margin-bottom: 0.75rem; width: 100%; max-width: 600px; padding-bottom: 0.1rem; }
    .poll-tab-btn {
      flex: 0 0 auto; padding: 0.35rem 0.75rem; border-radius: 8px; border: 1px solid var(--border);
      background: rgba(0,41,87,0.3); color: #a8bdd0; font-size: 0.8rem; cursor: pointer;
      white-space: nowrap; transition: all 0.15s;
    }
    .poll-tab-btn:hover { border-color: var(--gold); color: #f8f6f0; }
    .poll-tab-btn.active { background: rgba(194,154,91,0.18); border-color: var(--gold); color: #f8f6f0; font-weight: 700; }
    .tab-badge { font-size: 0.65rem; padding: 0.08rem 0.3rem; border-radius: 4px; margin-left: 0.3rem; }
    .badge-voting { background: #166534; color: #86efac; }
    .badge-closed { background: #1e3a5f; color: #a8bdd0; }
    .badge-idle { background: #2a2320; color: #888; }

    /* Prev / Next nav */
    .poll-nav { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 600px; margin-bottom: 0.75rem; }
    .nav-btn {
      padding: 0.35rem 0.9rem; border-radius: 8px; border: 1px solid var(--border);
      background: rgba(0,41,87,0.3); color: #a8bdd0; font-size: 0.85rem; cursor: pointer;
      transition: all 0.15s;
    }
    .nav-btn:hover:not(:disabled) { border-color: var(--gold); color: #f8f6f0; }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .nav-counter { font-size: 0.78rem; color: var(--steel); }

    .card { background: var(--card); border-radius: 14px; padding: 1.25rem; width: 100%; max-width: 600px; margin-bottom: 1rem; border: 1px solid var(--border); }
    .status-tag { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.18rem 0.55rem; border-radius: 6px; display: inline-block; margin-bottom: 0.75rem; font-weight: 700; }
    .tag-voting { background: rgba(34,197,94,0.12); color: #86efac; }
    .tag-closed { background: rgba(107,127,151,0.2); color: #a8bdd0; }
    .tag-idle { background: #222; color: #888; }
    .q { font-size: 1.05rem; font-weight: 700; color: var(--white); margin-bottom: 0.75rem; }

    .opt-btn {
      display: block; width: 100%; padding: 0.75rem 1rem; margin: 0.3rem 0;
      background: rgba(0,41,87,0.4); border: 2px solid rgba(194,154,91,0.25); border-radius: 9px;
      color: var(--light); font-size: 0.95rem; cursor: pointer; text-align: left;
      transition: all 0.2s; position: relative; overflow: hidden;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--gold); background: rgba(194,154,91,0.08); }
    .opt-btn:disabled { cursor: default; }
    .opt-btn.voted { border-color: #22c55e; background: rgba(34,197,94,0.06); }
    .opt-btn.correct { border-color: #16a34a !important; background: rgba(22,163,74,0.1) !important; }
    .opt-btn.leading { border-color: #f59e0b !important; }
    .opt-btn .bar { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(194,154,91,0.15); transition: width 0.5s ease; z-index: 0; }
    .opt-btn .text { position: relative; z-index: 1; }
    .opt-btn .count { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); font-size: 0.82rem; font-weight: 600; color: #8fa4b6; z-index: 1; }
    .chip { font-size: 0.65rem; background: #166534; color: #92e0a8; padding: 0.1rem 0.3rem; border-radius: 4px; margin-left: 0.3rem; font-weight: 700; position: relative; z-index: 1; }

    .wc-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .wc-input { flex: 1; padding: 0.6rem 0.9rem; background: rgba(0,41,87,0.4); border: 2px solid var(--border); border-radius: 9px; color: var(--light); font-size: 0.95rem; }
    .wc-input:focus { outline: none; border-color: var(--gold); }
    .wc-send { padding: 0.6rem 1rem; background: #c29a5b; border: none; border-radius: 9px; color: var(--navy); font-weight: 700; cursor: pointer; }
    .wc-send:disabled { opacity: 0.35; cursor: default; }
    .wc-cloud { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.5rem 0.7rem; min-height: 60px; }
    .wc-w { font-weight: 600; color: #e8c87a; text-shadow: 0 0 8px rgba(194,154,91,0.3); transition: font-size 0.4s; }
    .wc-empty { text-align: center; color: #6b7f97; font-size: 0.85rem; padding: 0.75rem; }
    .voted-badge { font-size: 0.72rem; background: rgba(34,197,94,0.15); color: #86efac; padding: 0.15rem 0.5rem; border-radius: 6px; display: inline-block; margin-bottom: 0.75rem; }

    .wait { text-align: center; color: #6b7f97; padding: 2rem; font-size: 0.95rem; }
    .footer { margin-top: auto; padding-top: 1.5rem; font-size: 0.72rem; color: #475569; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎓 Live Vote</h1>
    <span id="status" class="status-pill status-connecting">Connecting...</span>
  </div>

  <!-- Tab bar (only when multiple polls on current slide) -->
  <div id="tab-bar" class="poll-tabs" style="display:none"></div>

  <!-- Prev / Next navigation (only when multiple polls) -->
  <div id="poll-nav" class="poll-nav" style="display:none">
    <button id="nav-prev" class="nav-btn" onclick="navPoll(-1)">◀ Prev</button>
    <span id="nav-counter" class="nav-counter"></span>
    <button id="nav-next" class="nav-btn" onclick="navPoll(1)">Next ▶</button>
  </div>

  <div id="container"></div>
  <div class="footer"><span id="host"></span></div>

  <script>
    const WS = `${location.protocol==='https:'?'wss://':'ws://'}${location.host}/polls`
    let ws
    // All polls keyed by id
    let allPolls = {}
    // Current slide (synced from presenter navigation)
    let currentSlide = 0
    // Active poll id per slide (synced from server)
    let activePolls = {}
    // Currently displayed poll id (local selection within a slide)
    let activePollId = null

    function q(s) { return document.getElementById(s) }

    function connect() {
      setStatus('connecting')
      ws = new WebSocket(WS)
      ws.onopen = () => { setStatus('connected'); ws.send(JSON.stringify({type:'audience_join'})) }
      ws.onmessage = e => handle(JSON.parse(e.data))
      ws.onclose = () => { setStatus('disconnected'); allPolls = {}; render(); setTimeout(connect, 3000) }
      ws.onerror = () => ws.close()
    }

    function setStatus(s) {
      const el = q('status')
      el.className = `status-pill status-${s}`
      el.textContent = {connected:'Connected',connecting:'Connecting...',disconnected:'Reconnecting...'}[s]||s
    }

    function mergePolls(incoming) {
      const next = {}
      ;(incoming || []).forEach(p => {
        const old = allPolls[p.id]
        next[p.id] = { ...p, hasVoted: old?.hasVoted || false }
      })
      allPolls = next
    }

    function handle(msg) {
      switch (msg.type) {
        case 'audience_welcomed':
        case 'poll_state': {
          mergePolls(msg.polls)
          if (msg.activePolls) activePolls = { ...msg.activePolls }
          if (msg.currentSlide !== undefined) currentSlide = msg.currentSlide
          // Pick active poll for current slide
          resolveActivePoll()
          render()
          break
        }
        case 'slide_change': {
          mergePolls(msg.polls)
          if (msg.activePolls) activePolls = { ...msg.activePolls }
          if (msg.slideIndex !== undefined) currentSlide = msg.slideIndex
          // When slide changes, follow the presenter's active poll
          resolveActivePoll(true)
          render()
          break
        }
        case 'audience_state': {
          // just ignore — no viewer count shown
          break
        }
      }
    }

    /** Pick which poll to display for currentSlide */
    function resolveActivePoll(follow) {
      const slidePolls = pollsForSlide(currentSlide)
      if (!slidePolls.length) { activePollId = null; return }
      // If presenter set an active poll for this slide, follow it
      const presenterPick = activePolls[currentSlide]
      if (presenterPick && allPolls[presenterPick]) {
        activePollId = presenterPick
        return
      }
      // Otherwise keep current selection if it's still on this slide
      if (!follow && activePollId && slidePolls.find(p => p.id === activePollId)) return
      activePollId = slidePolls[0].id
    }

    function pollsForSlide(si) {
      return Object.values(allPolls).filter(p => Number(p.slideIndex) === si)
    }

    function selectPoll(id) {
      activePollId = id
      render()
    }

    function navPoll(dir) {
      const list = pollsForSlide(currentSlide)
      if (!list.length) return
      const ci = list.findIndex(p => p.id === activePollId)
      const ni = (ci + dir + list.length) % list.length
      selectPoll(list[ni].id)
    }

    function vote(pollId, i) {
      if (ws?.readyState !== WebSocket.OPEN) return
      ws.send(JSON.stringify({type:'audience_vote', pollId, optionIndex: i}))
      if (allPolls[pollId]) allPolls[pollId].hasVoted = true
      render()
    }

    function submitWord(id) {
      const input = q('wc-'+id)
      if (!input || ws?.readyState !== WebSocket.OPEN) return
      const text = input.value.trim()
      if (!text) return
      ws.send(JSON.stringify({type:'audience_word', pollId: id, text}))
      if (allPolls[id]) allPolls[id].hasVoted = true
      input.value = ''
      render()
    }

    function leading(p, i) {
      const v = p.votes || []; const m = Math.max(...v, 0); return v[i] === m && m > 0
    }

    function render() {
      const slidePolls = pollsForSlide(currentSlide)
      const multi = slidePolls.length > 1
      const activePoll = activePollId ? allPolls[activePollId] : null

      // Tab bar
      const tabBar = q('tab-bar')
      const pollNav = q('poll-nav')
      if (multi) {
        tabBar.style.display = 'flex'
        tabBar.innerHTML = slidePolls.map(p => {
          const badge = p.state === 'voting' ? 'badge-voting' : p.state === 'closed' ? 'badge-closed' : 'badge-idle'
          const stateLabel = p.state === 'voting' ? 'Live' : p.state === 'closed' ? 'Closed' : ''
          const icon = p.type === 'quiz' ? '🎯' : p.type === 'wordcloud' ? '☁️' : '☑️'
          const q = p.question.length > 20 ? p.question.slice(0, 20) + '…' : p.question
          return `<button class="poll-tab-btn ${p.id === activePollId ? 'active' : ''}" onclick="selectPoll('${p.id}')">${icon} ${esc(q)}${stateLabel ? `<span class="tab-badge ${badge}">${stateLabel}</span>` : ''}</button>`
        }).join('')

        pollNav.style.display = 'flex'
        const ci = slidePolls.findIndex(p => p.id === activePollId)
        q('nav-prev').disabled = ci <= 0
        q('nav-next').disabled = ci >= slidePolls.length - 1
        q('nav-counter').textContent = `${ci + 1} / ${slidePolls.length}`
      } else {
        tabBar.style.display = 'none'
        pollNav.style.display = 'none'
      }

      // Main content
      if (!activePoll) {
        q('container').innerHTML = '<div class="wait">Waiting for presenter to open a poll…</div>'
        return
      }

      const p = activePoll
      let tag = 'Waiting', tagC = 'tag-idle', body = ''
      if (p.state === 'voting') { tag = p.type === 'quiz' ? 'Answer Now!' : p.type === 'wordcloud' ? 'Share a word!' : 'Vote Now'; tagC = 'tag-voting' }
      if (p.state === 'closed') { tag = 'Closed'; tagC = 'tag-closed' }

      if (p.type === 'wordcloud') {
        const words = Object.entries(p.wordCounts || {}).map(([w,c]) => ({w, c: Number(c)})).sort((a,b) => b.c-a.c).slice(0, 30)
        const mx = Math.max(...words.map(x => x.c), 1)
        body = `<div class="wc-row">
          <input type="text" id="wc-${p.id}" class="wc-input" placeholder="Type a word and press Enter…"
            ${p.state !== 'voting' ? 'disabled' : ''}
            onkeydown="if(event.key==='Enter')submitWord('${p.id}')">
          <button class="wc-send" ${p.state !== 'voting' || p.hasVoted ? 'disabled' : ''} onclick="submitWord('${p.id}')">Send</button>
        </div>
        <div class="wc-cloud">${words.length
          ? words.map(x => { const s=14+(x.c/mx)*32, o=0.4+(x.c/mx)*0.6; return `<span class="wc-w" style="font-size:${s}px;opacity:${o}">${esc(x.w)}</span>` }).join('')
          : '<div class="wc-empty">Waiting for words…</div>'
        }</div>`
      } else {
        const total = (p.votes || []).reduce((a,b) => a+b, 0) || 0
        body = (p.options || []).map((opt, i) => {
          const votes = p.votes?.[i] || 0
          const pct = total > 0 ? Math.round(votes / total * 100) : 0
          const canVote = p.state === 'voting' && !p.hasVoted
          const show = p.state === 'closed' || p.state === 'voting' || p.hasVoted
          const isCorrect = p.type === 'quiz' && p.revealed && p.correctAnswer === i
          const isLead = leading(p, i)
          const label = typeof opt === 'string' ? opt : opt.text
          return `<button class="opt-btn ${p.hasVoted ? 'voted' : ''} ${isCorrect ? 'correct' : ''} ${isLead && show && !isCorrect ? 'leading' : ''}"
            ${canVote ? `onclick="vote('${p.id}',${i})"` : 'disabled'}>
            ${show ? `<div class="bar" style="width:${pct}%"></div>` : ''}
            <span class="text">${esc(label)}${isCorrect ? '<span class="chip">✓ Correct</span>' : ''}</span>
            ${show ? `<span class="count">${votes}${pct > 0 ? ' · ' + pct + '%' : ''}</span>` : ''}
          </button>`
        }).join('')
      }

      const votedMsg = p.hasVoted ? `<div class="voted-badge">✓ ${p.type === 'wordcloud' ? 'Submitted' : 'Voted'}</div>` : ''
      q('container').innerHTML = `<div class="card"><div class="status-tag ${tagC}">${tag}</div><div class="q">${esc(p.question)}</div>${votedMsg}${body}</div>`
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }

    q('host').textContent = location.host
    connect()
  </script>
</body>
</html>
