<!doctype html>
<!--
  The voting page, as the audience's phones see it. Alpine binds it to the state in
  `vote.ts`; `scripts/build-vote.mjs` inlines both into one self-contained file, so a
  phone needs nothing but the deck's own server.

  Written by Claude (Anthropic) under human review.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Live poll</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff; --fg: #111; --quiet: #595959; --line: #cfcfcf; --tint: rgb(0 0 0 / 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --fg: #f3f3f3; --quiet: #a6a6a6; --line: #444; --tint: rgb(255 255 255 / 0.12); }
    }
    * { box-sizing: border-box; margin: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font: 1.0625rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    ::selection { background: var(--fg); color: var(--bg); }
    main { max-width: 34rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

    #offline {
      position: sticky; top: 0; z-index: 1;
      padding: 0.6rem 1.25rem;
      background: var(--fg); color: var(--bg);
      font-size: 0.9rem; text-align: center;
    }

    section + section { margin-top: 3rem; padding-top: 3rem; border-top: 1px solid var(--line); }
    h1 { font-size: 1.6rem; line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }
    .hint { margin: 0.5rem 0 1.5rem; color: var(--quiet); }
    .empty h1 { margin-top: 20dvh; }

    .options { display: grid; gap: 0.6rem; }
    button, input { font: inherit; color: inherit; border-radius: 0.6rem; touch-action: manipulation; }
    :focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

    .option {
      position: relative; overflow: hidden;
      display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.75rem;
      width: 100%; min-height: 3.5rem; padding: 0.75rem 1rem;
      border: 1.5px solid var(--line); background: none;
      text-align: left; cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
    }
    .option:enabled:hover { border-color: var(--fg); }
    .option:enabled:active { transform: scale(0.985); }
    .option:disabled { cursor: default; }
    .option > * { position: relative; }
    .option .bar {
      position: absolute; inset: 0 auto 0 0;
      background: var(--tint);
    }
    .option .dot { width: 1.15rem; height: 1.15rem; border: 1.5px solid var(--quiet); border-radius: 50%; }
    .option.mine { border-color: var(--fg); border-width: 2px; font-weight: 650; }
    .option.mine .dot { border: 0.36rem solid var(--fg); }
    .option .share { font-variant-numeric: tabular-nums; color: var(--quiet); }
    .option.wrong { opacity: 0.5; }
    .option small { display: block; font-size: 0.8rem; font-weight: 400; color: var(--quiet); }

    form { display: flex; gap: 0.6rem; }
    input {
      flex: 1; min-width: 0; min-height: 3.5rem; padding: 0 1rem;
      border: 1.5px solid var(--line); background: none;
    }
    input::placeholder { color: var(--quiet); }
    input:focus { border-color: var(--fg); outline: none; }
    .send {
      min-height: 3.5rem; padding: 0 1.4rem;
      border: 0; background: var(--fg); color: var(--bg);
      font-weight: 650; cursor: pointer;
    }
    :disabled { opacity: 0.45; cursor: default; }
    .option:disabled { opacity: 1; }
    .option.wrong:disabled { opacity: 0.5; }

    .cloud { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.9rem; margin-top: 1.75rem; line-height: 1.15; }
    .cloud span { font-weight: 650; overflow-wrap: anywhere; }

    /* Reactions: a thumb-reachable bar; the emoji float up on the big screen. */
    #reactions {
      position: fixed; inset: auto 0 0; z-index: 1;
      display: flex; justify-content: center; gap: 0.5rem;
      padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom));
      background: var(--bg); border-top: 1px solid var(--line);
    }
    #reactions button {
      flex: 0 1 4rem; min-height: 3.25rem; padding: 0;
      border: 1.5px solid var(--line); background: none;
      font-size: 1.6rem; line-height: 1; cursor: pointer;
    }
    #reactions button:active { border-color: var(--fg); }
    #reactions button.sent { animation: sent 0.35s cubic-bezier(0.2, 0.7, 0.3, 1); }
    /* Cooling down: the buttons sit out, and a line along the top runs out as they come back. */
    #reactions::before {
      content: ""; position: absolute; inset: -1px 0 auto; height: 2px;
      background: var(--fg); transform-origin: left; transform: scaleX(0);
    }
    #reactions.cooling::before { animation: cooldown var(--wait) linear; }
    @keyframes cooldown { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    @keyframes sent { 40% { transform: translateY(-0.5rem) scale(1.25); } }
    body.has-reactions main { padding-bottom: 7rem; }

    @media (prefers-reduced-motion: reduce) {
      .option { transition: none; }
      #reactions button.sent, #reactions.cooling::before { animation: none; }
    }
  </style>
</head>
<body x-data="votePage" :class="{ 'has-reactions': online && reactions.length > 0 }">
  <div
    id="offline"
    role="status"
    style="display: none"
    x-show="!online"
    x-text="everConnected ? 'Connection lost. Reconnecting…' : 'Connecting…'"
  ></div>

  <main id="polls" aria-live="polite" :class="{ empty: !visible.length }">
    <template x-if="!visible.length">
      <section>
        <h1>No poll right now</h1>
        <p class="hint">Keep this page open. The next poll shows up here by itself.</p>
      </section>
    </template>

    <template x-for="poll in visible" :key="poll.id">
      <section>
        <!-- biome-ignore lint/a11y/useHeadingContent: Alpine fills it from the poll -->
        <h1 x-text="poll.question"></h1>
        <p class="hint" x-text="hint(poll)"></p>

        <!-- A choice poll or a quiz: one button per option, with its share once it is shown. -->
        <template x-if="poll.options">
          <div class="options">
            <template x-for="(label, index) in poll.options" :key="index">
              <button
                type="button"
                class="option"
                :class="{
                  mine: answered(poll) === index,
                  wrong: poll.revealed && index !== poll.correct,
                }"
                :disabled="!online || poll.state !== 'open' || answered(poll) !== undefined"
                @click="vote(poll, index)"
              >
                <span class="bar" x-show="showResults(poll)" :style="`width:${share(poll, index)}%`"></span>
                <span class="dot"></span>
                <span>
                  <span x-text="label"></span>
                  <small x-show="poll.revealed && index === poll.correct">Correct answer</small>
                </span>
                <span class="share" x-show="showResults(poll)" x-text="`${share(poll, index)} %`"></span>
              </button>
            </template>
          </div>
        </template>

        <!-- A word cloud: one word each, and the cloud once the presenter has weeded it. -->
        <template x-if="!poll.options">
          <div>
            <p x-show="answered(poll) !== undefined">
              You sent: <strong x-text="answered(poll)"></strong>
            </p>
            <form
              x-show="answered(poll) === undefined && poll.state === 'open'"
              @submit.prevent="sendWord(poll)"
            >
              <input
                x-model="drafts[poll.id]"
                name="word"
                maxlength="40"
                autocomplete="off"
                enterkeyhint="send"
                placeholder="Your word"
                aria-label="Your word"
              >
              <button type="submit" class="send" :disabled="!online">Send</button>
            </form>
            <div class="cloud">
              <template x-for="[word, count] in cloud(poll)" :key="word">
                <span x-text="word" :style="`font-size:${wordSize(poll, count)}`"></span>
              </template>
            </div>
          </div>
        </template>
      </section>
    </template>
  </main>

  <nav
    id="reactions"
    aria-label="Send a reaction"
    style="display: none"
    x-show="online && reactions.length > 0"
    :class="{ cooling: cooling }"
    :style="`--wait:${wait}ms`"
  >
    <template x-for="emoji in reactions" :key="emoji">
      <button
        type="button"
        x-text="emoji"
        :aria-label="`React with ${emoji}`"
        :class="{ sent: sent === emoji }"
        :disabled="cooling"
        @click="react(emoji)"
        @animationend="sent = ''"
      ></button>
    </template>
  </nav>

  <!--script-->
</body>
</html>
